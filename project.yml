name: Oceanna
options:
  bundleIdPrefix: com.oceanna
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 11.0.0

targets:
  Oceanna:
    type: application
    platform: iOS
    sources:
      - path: Oceanna
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: Oceanna/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.oceanna.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    preBuildScripts: []
    postBuildScripts: []
